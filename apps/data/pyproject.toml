[project]
name = "data"
version = "0.2.0"
description = "WINE data service — analytics, bilan IA, relances"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pymongo>=4.10",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
